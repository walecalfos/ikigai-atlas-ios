# Source of truth for IkigaiAtlas.xcodeproj, generated with XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The generated project is committed, so you can just open it. GitHub regenerates and commits it
# whenever files are added or removed; to do it yourself, run `xcodegen` in this folder.
name: IkigaiAtlas

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FluentUI:
    url: https://github.com/microsoft/fluentui-apple
    from: "0.37.0"
  IkigaiCore:
    path: Packages/IkigaiCore

targets:
  IkigaiAtlas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Bundle ID, team and the iCloud switch live in Config/App.xcconfig.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Resources/Fonts/OFL.txt"
      - path: Config
        buildPhase: none
    dependencies:
      - package: FluentUI
      - package: IkigaiCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ikigai Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIAppFonts:
          - ShipporiMinchoB1-Bold.ttf
          - ShipporiMinchoB1-ExtraBold.ttf
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Ikigai Atlas uses Face ID to keep your reflections private.
        IkigaiICloudSync: $(IKIGAI_ICLOUD_SYNC)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  IkigaiAtlas:
    build:
      targets:
        IkigaiAtlas: all
    run:
      config: Debug
    archive:
      config: Release
