name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Framework logic tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run IkigaiCore tests
        run: swift test --package-path Packages/IkigaiCore

  app-build:
    name: iOS app build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Check the app is present
        id: check
        run: |
          if [ -f App/IkigaiAtlasApp.swift ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.check.outputs.ready == 'true'
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        if: steps.check.outputs.ready == 'true'
        run: xcodebuild -version
      - name: Install XcodeGen
        if: steps.check.outputs.ready == 'true'
        run: brew install xcodegen
      - name: Generate Xcode project
        if: steps.check.outputs.ready == 'true'
        run: xcodegen generate
      - name: Build for iOS Simulator
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project IkigaiAtlas.xcodeproj \
            -scheme IkigaiAtlas \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*IkigaiAtlas|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report compiler errors as annotations
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import os, re
          root = os.getcwd() + "/"
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          located, other = [], []
          for line in open("build.log", errors="replace"):
              line = line.rstrip()
              m = re.search(r"(/[^\s:]+):(\d+):(\d+): (?:fatal )?error: (.*)", line)
              if m:
                  item = (m.group(1).replace(root, ""), m.group(2), m.group(4))
                  if item not in located:
                      located.append(item)
              elif "error:" in line and line not in other:
                  other.append(line)
          for path, ln, msg in located[:10]:
              print(f"::error file={path},line={ln}::{esc(msg)}")
          summary = [f"{p}:{l}: {m}" for p, l, m in located] + other
          if summary:
              print("::notice title=All build errors::" + esc("\n".join(summary[:80])))
          PY
      - name: Upload build log
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
